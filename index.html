<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Pathfinder — Tiger Guide</title>
    <script>
      (function () {
        var hash = window.location.hash;
        if (!hash || hash === '#') {
          var path = window.location.pathname;
          if (!path.endsWith('/')) path += '/';
          window.history.replaceState(null, '', path + window.location.search + '#/');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Debug banner: if you see this but the app is blank, JavaScript likely failed to run. -->

  </body>
</html>
